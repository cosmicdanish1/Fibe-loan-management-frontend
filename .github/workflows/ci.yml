name: CI

# Runs on every push and PR, and is also called by release.yml as the gate that
# must pass before a release draft is built.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check main process
        run: npx tsc -p tsconfig.electron.json --noEmit

      - name: Type-check renderer
        run: npx tsc -p tsconfig.json --noEmit

      - name: Unit tests
        run: npm test
