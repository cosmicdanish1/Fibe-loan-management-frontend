name: CI

# Runs on every push and PR, and is also called by release.yml as the gate that
# must pass before a release draft is built.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check main process
        run: npx tsc -p tsconfig.electron.json --noEmit

      - name: Type-check renderer
        run: npx tsc -p tsconfig.json --noEmit

      # *.snap files are in .gitignore, so no snapshot exists on a fresh checkout. Locally vitest quietly
      # creates a missing snapshot; in CI it refuses and fails every snapshot test ("mismatched").
      # --update lets CI create them, so these tests still render every screen and check their other
      # assertions, but their snapshots guard nothing until the .snap files are committed.
      - name: Unit tests
        run: npm test -- --update
